name: LLMO sync (visibilidad en IA)

# Le pregunta a un LLM con búsqueda (12 prompts × 3 categorías) y mide la tasa de mención de cada
# marca + las URLs que cita. SEMANAL (sep-2026): las muestras se acumulan 28 días (seo_llmo_muestra,
# migración 0118) → n ≈ 48 respuestas por categoría e intervalo de Wilson usable. Antes: 5 prompts
# 1x/mes (n=5, IC ±40 pp). Costo ≈ US$1,3/corrida (≈ US$5,6/mes). Usa OPENAI_API_KEY (Vercel);
# LLMO_CALLS_POR_CAT (opcional) baja/sube las llamadas por categoría.
on:
  schedule:
    - cron: "30 6 * * 1"  # lunes 06:30 UTC
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger /api/cron/llmo-sync
        run: |
          set -euo pipefail
          URL="https://dashboard-mkt-seven.vercel.app/api/cron/llmo-sync"
          HTTP=$(curl -s -o resp.json -w '%{http_code}' --max-time 300 -H "Authorization: Bearer ${CRON_SECRET:-}" "$URL")
          cat resp.json; echo ""
          if [ "$HTTP" != "200" ]; then echo "::error::HTTP $HTTP"; exit 1; fi
          python3 -c "import json,sys; d=json.load(open('resp.json')); sys.exit(0 if d.get('ok') else 1)" || { echo "::error::llmo-sync falló"; exit 1; }
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
