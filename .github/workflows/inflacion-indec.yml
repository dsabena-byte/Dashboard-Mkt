name: Inflación REAL (INDEC)

on:
  schedule:
    - cron: "0 13 8-20 * *"  # INDEC publica el IPC a mediados de mes; solo escribe si hay un mes nuevo o corregido
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = solo mostrar, no escribir"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger /api/cron/inflacion-indec
        run: |
          set -euo pipefail
          URL="https://dashboard-mkt-seven.vercel.app/api/cron/inflacion-indec"
          if [ -n "${DRY:-}" ]; then URL="$URL?dry=1"; fi
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" --max-time 120 -H "Authorization: Bearer ${CRON_SECRET:-}" "$URL")
          echo "HTTP $HTTP_CODE"; cat response.json; echo ""
          if [ "$HTTP_CODE" != "200" ] || grep -q '"ok":false' response.json; then echo "::error::inflacion-indec falló"; exit 1; fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY: ${{ github.event.inputs.dry }}
