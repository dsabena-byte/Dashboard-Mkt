name: DB inspect (read-only)

# Fallback manual para consultar Supabase desde el runner de GitHub Actions.
# Normalmente NO hace falta: el entorno de Claude ya llega directo a Supabase
# (network access "Custom" con *.supabase.co). Esto queda como respaldo por si
# la red se bloquea. Corre UNA consulta SQL dentro de una transacción READ ONLY
# (cualquier escritura/DDL falla). El resultado queda en el log. Se dispara a
# mano desde Actions -> "Run workflow".
on:
  workflow_dispatch:
    inputs:
      sql:
        description: "Consulta SQL de solo-lectura (SELECT) a correr contra Supabase"
        required: true
        default: "select 1 as ok;"

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Asegurar psql
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Correr consulta (transacción READ ONLY)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SQL: ${{ github.event.inputs.sql }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then echo "::error::Falta el secret SUPABASE_DB_URL"; exit 1; fi
          printf 'BEGIN TRANSACTION READ ONLY;\n%s\nROLLBACK;\n' "$SQL" \
            | psql "$DB_URL" -v ON_ERROR_STOP=1 -P pager=off
