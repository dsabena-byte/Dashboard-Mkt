name: DB inspect (read-only)

# Puente para consultar Supabase desde el runner de GitHub Actions (que tiene
# salida a internet, a diferencia del entorno del agente). Corre el SQL dentro
# de una transacción READ ONLY: cualquier escritura/DDL falla. El resultado
# queda en el log del run.
#
# Dos formas de disparar:
#  1) push que modifique ops/db-query.sql  -> corre ese archivo (lo usa el agente)
#  2) workflow_dispatch con el input `sql` -> corre esa consulta (a mano en la UI)
on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:
    inputs:
      sql:
        description: "Consulta SQL de solo-lectura (SELECT) a correr contra Supabase"
        required: true
        default: "select 1 as ok;"

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Asegurar psql
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Correr consulta (transacción READ ONLY)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SQL_INPUT: ${{ github.event.inputs.sql }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then echo "::error::Falta el secret SUPABASE_DB_URL"; exit 1; fi
          if [ -n "${SQL_INPUT:-}" ]; then
            SQL="$SQL_INPUT"
          elif [ -f ops/db-query.sql ]; then
            SQL="$(cat ops/db-query.sql)"
          else
            echo "::error::No hay SQL (ni input ni ops/db-query.sql)"; exit 1
          fi
          printf 'BEGIN TRANSACTION READ ONLY;\n%s\nROLLBACK;\n' "$SQL" \
            | psql "$DB_URL" -v ON_ERROR_STOP=1 -P pager=off
