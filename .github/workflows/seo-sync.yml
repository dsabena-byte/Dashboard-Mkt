name: SEO sync (SERP matrix · competitivo)

# Módulo B · SEO Competitivo: para cada keyword del universo consulta la SERP y
# guarda la posición de cada dominio (marcas + retailers) → seo_rankings.
# Se procesa por chunks (Vercel corta a 300s): el loop llama offset=0,80,160...
# hasta cubrir todo. MENSUAL (el índice se mueve lento → no hace falta semanal).
# COLA STANDARD (sep-2026): cada chunk encola sus keywords (task_post, ≈3,3× más barato que /live) y
# completa por /live solo lo que no llega a tiempo. Antes, todo /live depth-100 ≈ $5-7 por corrida.
# Chunks de 100 (la cola tarda 1-3 min por chunk). DATAFORSEO_MODE=live (Vercel) vuelve a todo /live
# (entonces conviene limit=40). NECESITA saldo en DataForSEO.
on:
  schedule:
    - cron: "40 6 1 * *"  # día 1 de cada mes, 06:40 UTC (mensual: el índice se mueve lento y el SERP es caro)
  workflow_dispatch:
    inputs:
      limit:
        description: "Keywords por chunk (default 100 con cola Standard; 40 si DATAFORSEO_MODE=live)"
        required: false
        default: "100"

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: SERP matrix por chunks
        run: |
          set -euo pipefail
          BASE="https://dashboard-mkt-seven.vercel.app/api/cron/seo-sync"
          LIMIT="${{ github.event.inputs.limit || '100' }}"
          OFFSET=0
          for i in $(seq 1 30); do
            URL="${BASE}?offset=${OFFSET}&limit=${LIMIT}"
            echo "== chunk offset=${OFFSET} =="
            HTTP=$(curl -s -o resp.json -w '%{http_code}' --max-time 300 -H "Authorization: Bearer ${CRON_SECRET:-}" "$URL")
            cat resp.json; echo ""
            if [ "$HTTP" != "200" ]; then echo "::error::HTTP $HTTP"; exit 1; fi
            RESTO=$(python3 -c "import json,sys; d=json.load(open('resp.json')); print('ERR' if not d.get('ok') else d.get('resto',0))")
            if [ "$RESTO" = "ERR" ]; then
              echo "::error::sync falló: $(python3 -c "import json; print(json.load(open('resp.json')).get('error'))")"; exit 1
            fi
            OFFSET=$((OFFSET + LIMIT))
            if [ "$RESTO" -le 0 ]; then echo "Completo."; break; fi
          done
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Snapshot mensual del índice de posición
        run: |
          set -euo pipefail
          URL="https://dashboard-mkt-seven.vercel.app/api/cron/seo-index-snapshot"
          echo "== snapshot índice =="
          HTTP=$(curl -s -o snap.json -w '%{http_code}' --max-time 120 -H "Authorization: Bearer ${CRON_SECRET:-}" "$URL")
          cat snap.json; echo ""
          if [ "$HTTP" != "200" ]; then echo "::error::HTTP $HTTP"; exit 1; fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
