name: Meta FB sync (cada 12h)

on:
  schedule:
    - cron: "0 */12 * * *"  # 00:00 y 12:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Días hacia atrás a sincronizar (200 = backfill de todo 2026)"
        type: string
        default: "50"

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger /api/cron/meta-fb-sync
        run: |
          set -euo pipefail
          # Tomamos solo los dígitos del input (tolera "?days=200", "200 días", etc.).
          # OJO: en runs por SCHEDULE, inputs.days viene VACÍO → cae a este fallback.
          # Tiene que ser ~50 (no 3): el reach de FB (post_total_media_view_unique) es
          # LIFETIME y madura por semanas. Con ventana de 3 días cada post se congelaba
          # con el reach INMADURO → los meses recientes salían subestimados (ago-2026 daba
          # ~5K cuando lo real es ~20-30K). 50 días = cada post se sigue refrescando hasta
          # madurar (el reach se estabiliza a los ~30 días; 50 da margen). Costo bajo:
          # ~30 posts × (1 insights call + 1 HEAD idempotente de thumbnail) por corrida.
          DAYS="$(printf '%s' "${DAYS_INPUT:-50}" | grep -oE '[0-9]+' | head -1)"
          DAYS="${DAYS:-50}"
          URL="https://dashboard-mkt-seven.vercel.app/api/cron/meta-fb-sync?days=${DAYS}"
          echo "GET $URL"
          if [ -n "${CRON_SECRET:-}" ]; then
            curl -fsS --max-time 600 "$URL" \
              -H "Authorization: Bearer $CRON_SECRET" | tee out.json
          else
            curl -fsS --max-time 600 "$URL" | tee out.json
          fi
          if grep -q '"ok":false' out.json; then
            echo "Cron devolvió ok=false"
            exit 1
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DAYS_INPUT: ${{ inputs.days }}
