name: CB mirror (copia CB + Floor Share al principal, 1x/día)

on:
  schedule:
    - cron: "40 6 * * *"  # 1x/día (06:40 UTC ≈ 03:40 ART) — la data CB se carga semanal
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger /api/cron/cb-mirror
        run: |
          set -euo pipefail
          URL="https://dashboard-mkt-seven.vercel.app/api/cron/cb-mirror"
          echo "GET $URL"
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" --max-time 600 \
            -H "Authorization: Bearer ${CRON_SECRET:-}" \
            "$URL")
          echo "HTTP $HTTP_CODE"
          cat response.json; echo ""
          if [ "$HTTP_CODE" != "200" ]; then echo "::error::HTTP $HTTP_CODE"; exit 1; fi
          if grep -q '"ok":false' response.json; then echo "::error::ok=false"; exit 1; fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
