name: Google Ads sync (OMD · nivel creativo)

on:
  schedule:
    - cron: "45 5 * * *"  # 05:45 UTC diario (después del GA4)
  workflow_dispatch:
    inputs:
      days:
        description: "Días de backfill (1-365). Default 30."
        required: false
        default: "30"
      dry:
        description: "1 = dry-run (no escribe, sólo valida). Vacío = ingest."
        required: false
        default: ""

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger /api/cron/google-ads-sync
        run: |
          set -euo pipefail
          DAYS="${{ github.event.inputs.days || '30' }}"
          DRY="${{ github.event.inputs.dry || '' }}"
          URL="https://dashboard-mkt-seven.vercel.app/api/cron/google-ads-sync?days=${DAYS}"
          if [ -n "$DRY" ]; then URL="${URL}&dry=1"; fi
          echo "GET $URL"
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" --max-time 600 \
            -H "Authorization: Bearer ${CRON_SECRET:-}" \
            "$URL")
          echo "HTTP $HTTP_CODE"
          echo "Response body:"
          cat response.json
          echo ""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi
          # Parseo real del JSON (el grep viejo no matcheaba "error_<cuenta>" ni el
          # \"error\" escapado adentro del mensaje → reportaba OK con 0 filas).
          # Falla si: hay clave error/error_*, alguna cuenta dio -1, o total_filas=0.
          python3 - "$DRY" <<'PY'
          import json, sys
          dry = sys.argv[1] != ""
          try:
              d = json.load(open("response.json"))
          except Exception as e:
              print(f"::error::respuesta no es JSON válido: {e}"); sys.exit(1)
          errs = [k for k in d if k == "error" or k.startswith("error_")]
          if errs:
              for k in errs: print(f"::error::{k}: {str(d[k])[:300]}")
              sys.exit(1)
          malas = [c for c, n in (d.get("filas_por_cuenta") or {}).items() if n == -1]
          if malas:
              print(f"::error::cuentas con error de auth/fetch: {', '.join(malas)}")
              sys.exit(1)
          tot = d.get("total_filas")
          if not dry and (tot is None or tot == 0):
              print(f"::error::el sync trajo 0 filas (upsert: {d.get('upsert')})")
              sys.exit(1)
          print(f"OK real: total_filas={tot}, upsert={d.get('upsert')}")
          PY
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
