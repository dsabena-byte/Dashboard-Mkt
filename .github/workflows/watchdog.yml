name: Watchdog — monitor de syncs

on:
  schedule:
    - cron: "20 */6 * * *"  # cada 6h, desfasado de los syncs para verlos ya corridos
  workflow_dispatch:

permissions:
  actions: write   # re-ejecutar workflows fallidos
  issues: write    # abrir/cerrar issue de alerta
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}   # sin esto, `gh run list` no sabe el repo y devuelve vacío ("none")
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      HEALTH_URL: https://dashboard-mkt-seven.vercel.app/api/cron/health
    steps:
      - uses: actions/checkout@v4
      - name: Detectar, diagnosticar y corregir
        run: bash .github/scripts/watchdog.sh
