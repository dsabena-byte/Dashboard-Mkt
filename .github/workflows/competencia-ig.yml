name: Competencia IG (Business Discovery + fotos por edad + temas)

# Refresco DIARIO de la competencia de redes (/redes):
#  · bd    : cuentas de Instagram de la competencia por Business Discovery (Graph oficial, token de la
#            Página de Drean = META_SYSTEM_USER_TOKEN en Vercel). Lo que la API no cubre queda con el
#            scraper n8n + Apify (fallback, sin cambios).
#  · snaps : fotos por edad (1/3/7 días) → social_post_snapshots (migración 0115).
#  · temas : tema corto por post con gpt-4o-mini (migración 0116).
# Diario porque las ventanas de 1/3/7 días necesitan una observación por día.

on:
  schedule:
    - cron: "37 10 * * *"   # 07:37 ART
  workflow_dispatch:
    inputs:
      part:
        description: "Parte: all | bd | snaps | temas | pilar"
        required: false
        default: "all"
      mode:
        description: "daily (25 posts por marca) | full (hasta 100, backfill)"
        required: false
        default: "daily"

jobs:
  competencia-ig:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger /api/cron/competencia-ig
        run: |
          set -euo pipefail
          PART="${PART_INPUT:-all}"
          MODE="${MODE_INPUT:-daily}"
          BASE="${APP_URL:-https://dashboard-mkt-seven.vercel.app}"
          URL="$BASE/api/cron/competencia-ig?part=$PART&mode=$MODE"
          echo "GET $URL"
          if [ -n "${CRON_SECRET:-}" ]; then
            curl -fsS --max-time 290 "$URL" -H "Authorization: Bearer $CRON_SECRET" | tee out.json
          else
            curl -fsS --max-time 290 "$URL" | tee out.json
          fi
          if grep -q '"ok":false' out.json; then
            echo "Cron devolvió ok=false"
            exit 1
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
          PART_INPUT: ${{ inputs.part }}
          MODE_INPUT: ${{ inputs.mode }}
